services:
  - type: web
    name: diskoko
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BASE_URL
        value: https://diskoko.onrender.com
      - key: FRONTEND_URL
        value: https://diskoko.onrender.com
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: diskoko-db
          property: connectionString
databases:
  - name: diskoko-db
    plan: free
